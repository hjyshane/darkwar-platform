name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Development is Windows-only, so Linux CI is the only thing catching
  # case-sensitivity, line-ending, and path assumptions before they harden.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          # v9 flipped prune-cache to false, which grows the cache for no
          # benefit here — the dependency set is small and rarely changes.
          prune-cache: true
      # No --extra capture: the pipeline must be testable without Npcap.
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # v5 started auto-caching whenever package.json has a
          # `packageManager` field, and ours pins pnpm. That cache step shells
          # out to pnpm, which does not exist until `corepack enable` runs on
          # the next line — so leaving it enabled fails the job outright.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned, not `latest`. `latest` re-resolved the release on every
          # run and intermittently died on "rate limit exceeded" — a failure
          # with nothing to do with the code under test. Keep this in step
          # with the CLI used locally so pgTAP runs against the same binary.
          version: 2.110.0
      - run: supabase start
      # Proves migrations apply from an empty database, not just incrementally.
      - run: supabase db reset
      - run: supabase test db
      # Committed types must match the schema they claim to describe.
      - name: Check generated types are current
        run: |
          supabase gen types typescript --local > packages/shared-types/src/database.types.ts
          if git diff --quiet -- packages/shared-types/src/database.types.ts; then
            exit 0
          fi
          echo "::error::Generated types are stale: a migration changed the schema but packages/shared-types/src/database.types.ts was not regenerated."
          echo ""
          echo "Fix locally, with the stack running:"
          echo "    supabase start"
          echo "    pnpm db:types"
          echo "    git add packages/shared-types/src/database.types.ts"
          echo ""
          echo "What the schema produces vs what is committed:"
          git --no-pager diff -- packages/shared-types/src/database.types.ts
          exit 1

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI directly (same binary as the lefthook pre-commit
      # hook), not gitleaks-action: the action calls the PR API, which the
      # read-only default token cannot do ("Resource not accessible by
      # integration"), and PR comments are noise on a solo repo anyway.
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact
      # Matches import STATEMENTS only. The previous pattern was
      # `(from|import)[^\n]*legacy`, which also matched prose — every
      # promoted parser's docstring says "promoted from legacy/v0.4.1",
      # which is exactly the provenance note NFR-009 asks for. That left
      # this job permanently red, so a real violation would have looked
      # identical to the noise.
      - name: Reject imports from quarantined legacy code
        run: |
          if grep -rnE --include='*.py' --include='*.ts' --include='*.tsx' \
               -e "^[[:space:]]*(from|import)[[:space:]]+[^[:space:]\"']*legacy" \
               -e "^[[:space:]]*import[[:space:]].*from[[:space:]]*[\"'][^\"']*legacy" \
               -e "^[[:space:]]*import[[:space:]]*[\"'][^\"']*legacy" \
               -e "require\([[:space:]]*[\"'][^\"']*legacy" \
               services apps packages 2>/dev/null; then
            echo "::error::legacy/ is quarantined reference material and must not be imported."
            exit 1
          fi
      - name: Reject capture artifacts and databases
        run: |
          if git ls-files | grep -E '\.(pcap|pcapng|db|sqlite3?)$'; then
            echo "::error::Capture files and databases must never be committed."
            exit 1
          fi
