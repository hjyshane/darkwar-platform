name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only for pull requests. A PR's ref is `refs/pull/N/merge`, unique per PR, so
  # cancelling there kills nothing but the author's own superseded push.
  #
  # A push to main is always `refs/heads/main`, so cancel-in-progress meant every
  # merge killed the previous merge's run. Six merges in an afternoon left six
  # cancelled runs — which the checks UI reports as failure — and main, the branch
  # the deploy comes from, was never actually checked end to end. A cancelled run
  # and a red run look identical from outside, which is how this survived.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas this change actually touches, so the jobs below can skip what
  # it cannot have broken. Added when the month's Actions minutes ran out
  # (2026-08-09): a docs-only handover PR was burning the full six-minute
  # matrix, and most PRs here touch exactly one area. Cross-area effects flow
  # through committed files in this repo — a column change lands in supabase/
  # AND the regenerated types under packages/ — so filtering on touched paths
  # does not lose them.
  #
  # `guard` is deliberately NOT filtered: a secret can be pasted into any
  # file, including a markdown handover, and that scan is the cheapest job
  # in the matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v7
      # Exact version, same policy as every action here.
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            python:
              - 'services/**'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - '.nvmrc'
            db:
              - 'supabase/**'
              - 'packages/shared-types/**'

  # Development is Windows-only, so Linux CI is the only thing catching
  # case-sensitivity, line-ending, and path assumptions before they harden.
  python:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v7
      # Exact tag, not @v9: this action publishes no floating major tag past
      # v6, so @v9 fails to resolve before any step runs.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # v9 flipped prune-cache to false, which grows the cache for no
          # benefit here — the dependency set is small and rarely changes.
          prune-cache: true
      # No --extra capture: the pipeline must be testable without Npcap.
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # From .nvmrc, so CI and the Cloudflare build image read the same
          # file. The alternative is a version pinned here and another typed
          # into a hosting dashboard, where a typo is invisible until a build
          # silently uses whatever default that host happens to ship.
          node-version-file: .nvmrc
          # v5 started auto-caching whenever package.json has a
          # `packageManager` field, and ours pins pnpm. That cache step shells
          # out to pnpm, which does not exist until `corepack enable` runs on
          # the next line — so leaving it enabled fails the job outright.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned, not `latest`. `latest` re-resolved the release on every
          # run and intermittently died on "rate limit exceeded" — a failure
          # with nothing to do with the code under test. Keep this in step
          # with the CLI used locally so pgTAP runs against the same binary.
          version: 2.110.0
      - run: supabase start
      # Proves migrations apply from an empty database, not just incrementally.
      - run: supabase db reset
      - run: supabase test db
      # Committed types must match the schema they claim to describe.
      - name: Check generated types are current
        run: |
          supabase gen types typescript --local > packages/shared-types/src/database.types.ts
          if git diff --quiet -- packages/shared-types/src/database.types.ts; then
            exit 0
          fi
          echo "::error::Generated types are stale: a migration changed the schema but packages/shared-types/src/database.types.ts was not regenerated."
          echo ""
          echo "Fix locally, with the stack running:"
          echo "    supabase start"
          echo "    pnpm db:types"
          echo "    git add packages/shared-types/src/database.types.ts"
          echo ""
          echo "What the schema produces vs what is committed:"
          git --no-pager diff -- packages/shared-types/src/database.types.ts
          exit 1

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI directly (same binary as the lefthook pre-commit
      # hook), not gitleaks-action: the action calls the PR API, which the
      # read-only default token cannot do ("Resource not accessible by
      # integration"), and PR comments are noise on a solo repo anyway.
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact
      # Matches import STATEMENTS only. The previous pattern was
      # `(from|import)[^\n]*legacy`, which also matched prose — every
      # promoted parser's docstring says "promoted from legacy/v0.4.1",
      # which is exactly the provenance note NFR-009 asks for. That left
      # this job permanently red, so a real violation would have looked
      # identical to the noise.
      - name: Reject imports from quarantined legacy code
        run: |
          if grep -rnE --include='*.py' --include='*.ts' --include='*.tsx' \
               -e "^[[:space:]]*(from|import)[[:space:]]+[^[:space:]\"']*legacy" \
               -e "^[[:space:]]*import[[:space:]].*from[[:space:]]*[\"'][^\"']*legacy" \
               -e "^[[:space:]]*import[[:space:]]*[\"'][^\"']*legacy" \
               -e "require\([[:space:]]*[\"'][^\"']*legacy" \
               services apps packages 2>/dev/null; then
            echo "::error::legacy/ is quarantined reference material and must not be imported."
            exit 1
          fi
      - name: Reject capture artifacts and databases
        run: |
          if git ls-files | grep -E '\.(pcap|pcapng|db|sqlite3?)$'; then
            echo "::error::Capture files and databases must never be committed."
            exit 1
          fi
