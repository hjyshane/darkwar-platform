name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Run workflow button: a release without a commit, for when the deploy
  # itself is what needs proving (a new token) or redoing. Builds and checks
  # the dashboard exactly as a merge would, then deploys main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only for pull requests. A PR's ref is `refs/pull/N/merge`, unique per PR, so
  # cancelling there kills nothing but the author's own superseded push.
  #
  # A push to main is always `refs/heads/main`, so cancel-in-progress meant every
  # merge killed the previous merge's run. Six merges in an afternoon left six
  # cancelled runs — which the checks UI reports as failure — and main, the branch
  # the deploy comes from, was never actually checked end to end. A cancelled run
  # and a red run look identical from outside, which is how this survived.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas this change actually touches, so the jobs below can skip what
  # it cannot have broken. Added when the month's Actions minutes ran out
  # (2026-08-09): a docs-only handover PR was burning the full six-minute
  # matrix, and most PRs here touch exactly one area. Cross-area effects flow
  # through committed files in this repo — a column change lands in supabase/
  # AND the regenerated types under packages/ — so filtering on touched paths
  # does not lose them.
  #
  # `guard` is deliberately NOT filtered: a secret can be pasted into any
  # file, including a markdown handover, and that scan is the cheapest job
  # in the matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v7
      # Exact version, same policy as every action here.
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            python:
              - 'services/**'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - '.nvmrc'
            db:
              - 'supabase/**'
              - 'packages/shared-types/**'

  # Development is Windows-only, so Linux CI is the only thing catching
  # case-sensitivity, line-ending, and path assumptions before they harden.
  python:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v7
      # Exact tag, not @v9: this action publishes no floating major tag past
      # v6, so @v9 fails to resolve before any step runs.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # v9 flipped prune-cache to false, which grows the cache for no
          # benefit here — the dependency set is small and rarely changes.
          prune-cache: true
      # No --extra capture: the pipeline must be testable without Npcap.
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # From .nvmrc, so CI and the Cloudflare build image read the same
          # file. The alternative is a version pinned here and another typed
          # into a hosting dashboard, where a typo is invisible until a build
          # silently uses whatever default that host happens to ship.
          node-version-file: .nvmrc
          # v5 started auto-caching whenever package.json has a
          # `packageManager` field, and ours pins pnpm. That cache step shells
          # out to pnpm, which does not exist until `corepack enable` runs on
          # the next line — so leaving it enabled fails the job outright.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned, not `latest`. `latest` re-resolved the release on every
          # run and intermittently died on "rate limit exceeded" — a failure
          # with nothing to do with the code under test. Keep this in step
          # with the CLI used locally so pgTAP runs against the same binary.
          version: 2.110.0
      - run: supabase start
      # Proves migrations apply from an empty database, not just incrementally.
      - run: supabase db reset
      - run: supabase test db
      # Committed types must match the schema they claim to describe.
      - name: Check generated types are current
        run: |
          supabase gen types typescript --local > packages/shared-types/src/database.types.ts
          if git diff --quiet -- packages/shared-types/src/database.types.ts; then
            exit 0
          fi
          echo "::error::Generated types are stale: a migration changed the schema but packages/shared-types/src/database.types.ts was not regenerated."
          echo ""
          echo "Fix locally, with the stack running:"
          echo "    supabase start"
          echo "    pnpm db:types"
          echo "    git add packages/shared-types/src/database.types.ts"
          echo ""
          echo "What the schema produces vs what is committed:"
          git --no-pager diff -- packages/shared-types/src/database.types.ts
          exit 1

  # The dashboard's production release, from here and nowhere else.
  #
  # Cloudflare's own Git integration (Workers Builds) built every main commit
  # until 2026-10: then it hung at "Initializing build environment" or failed
  # in 0 seconds on #342, #343 and #344, and each release went out by hand.
  # It also never had a gate — a merge went live whatever CI said. This job
  # deploys only after the checks a dashboard change can break have passed,
  # and only when the dashboard could have changed.
  #
  # Turn the Cloudflare integration's automatic builds OFF when this is set up
  # (docs/runbooks/going-public.md §6-2), or the two race to publish.
  deploy:
    runs-on: ubuntu-latest
    needs: [changes, web, db, guard]
    # !cancelled(): `db` is skipped when no migration changed, and a skipped
    # need would otherwise skip this job too. Every need is still checked.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && needs.changes.outputs.web == 'true')
          || github.event_name == 'workflow_dispatch')
      && needs.web.result == 'success'
      && needs.guard.result == 'success'
      && (needs.db.result == 'success' || needs.db.result == 'skipped')
    # One release at a time, in merge order; never cancel one half-way.
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: production
      url: https://cbfw.us
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Repository VARIABLES, not secrets: both end up in the shipped
      # JavaScript anyway. Without them the build silently falls back to the
      # local stack (src/lib/env.ts) and a bundle pointing at 127.0.0.1 would
      # go live, so their absence stops the job instead.
      - name: Build
        working-directory: apps/dashboard
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY repository variables."
            exit 1
          fi
          pnpm build
          if grep -rq '127.0.0.1:54321' dist/assets; then
            echo "::error::The bundle points at the local Supabase stack; refusing to deploy it."
            exit 1
          fi
      # npx, not cloudflare/wrangler-action: the action `npm i`s wrangler into
      # the working directory, and npm cannot read this pnpm workspace's
      # `workspace:*` dependencies (EUNSUPPORTEDPROTOCOL, first run 2026-10-03).
      # npx keeps wrangler in its own cache — the manual path in §6 does the same.
      - name: Deploy
        working-directory: apps/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy
      # The release is what https://cbfw.us serves, not what wrangler said.
      - name: Confirm the live page serves this build
        working-directory: apps/dashboard
        run: |
          want=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -sf https://cbfw.us/ | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            if [ "$live" = "$want" ]; then
              echo "cbfw.us serves $want"
              exit 0
            fi
            sleep 10
          done
          echo "::error::cbfw.us serves '$live', expected '$want'."
          exit 1

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI directly (same binary as the lefthook pre-commit
      # hook), not gitleaks-action: the action calls the PR API, which the
      # read-only default token cannot do ("Resource not accessible by
      # integration"), and PR comments are noise on a solo repo anyway.
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact
      # The version is the key of supabase_migrations.schema_migrations. Two
      # files sharing one stop `supabase start` at the second, and against the
      # hosted project the second reads as already applied, so `db push`
      # skips it without a word. #255 merged a 0165 on top of the hive's 0165.
      - name: Reject two migrations with one version
        run: |
          dupes=$(ls supabase/migrations | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::migration versions used twice: $dupes"
            exit 1
          fi
      # Matches import STATEMENTS only. The previous pattern was
      # `(from|import)[^\n]*legacy`, which also matched prose — every
      # promoted parser's docstring says "promoted from legacy/v0.4.1",
      # which is exactly the provenance note NFR-009 asks for. That left
      # this job permanently red, so a real violation would have looked
      # identical to the noise.
      - name: Reject imports from quarantined legacy code
        run: |
          if grep -rnE --include='*.py' --include='*.ts' --include='*.tsx' \
               -e "^[[:space:]]*(from|import)[[:space:]]+[^[:space:]\"']*legacy" \
               -e "^[[:space:]]*import[[:space:]].*from[[:space:]]*[\"'][^\"']*legacy" \
               -e "^[[:space:]]*import[[:space:]]*[\"'][^\"']*legacy" \
               -e "require\([[:space:]]*[\"'][^\"']*legacy" \
               services apps packages 2>/dev/null; then
            echo "::error::legacy/ is quarantined reference material and must not be imported."
            exit 1
          fi
      - name: Reject capture artifacts and databases
        run: |
          if git ls-files | grep -E '\.(pcap|pcapng|db|sqlite3?)$'; then
            echo "::error::Capture files and databases must never be committed."
            exit 1
          fi
