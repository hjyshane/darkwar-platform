<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dark War</title>
  </head>
  <body>
    <main>
      <h1>Dark War</h1>
      <nav>
        <button id="tab-search" type="button">Search</button>
        <button id="tab-profile" type="button">Profile</button>
        <button id="tab-roster" type="button">Roster</button>
        <button id="tab-arena" type="button">Arena</button>
        <button id="tab-settings" type="button">Settings</button>
      </nav>
      <section id="view-search">
        <p id="status">starting…</p>
        <input id="needle" placeholder="UID, or part of a name" />
        <button id="go" type="button">Find</button>
        <pre id="out"></pre>
        <div id="map-root"></div>
      </section>
      <section id="view-profile" hidden>
        <div id="profile-root"></div>
      </section>
      <section id="view-roster" hidden>
        <div id="roster-root"></div>
      </section>
      <section id="view-arena" hidden>
        <div id="arena-root"></div>
      </section>
      <section id="view-settings" hidden>
        <div id="settings-root"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
